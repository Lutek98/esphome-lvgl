# The styles below use these fonts, to change the font size, change the size here
font:
  - file: "gfonts://Roboto"
    id: statistics_font
    size: 48
    bpp: 4

  # label_font also draws all button captions - includes Polish characters
  - file: "gfonts://Roboto"
    id: label_font
    size: 22
    bpp: 4
    glyphs: ' !"#%&''()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[]_abcdefghijklmnopqrstuvwxyz°ĄĆĘŁŃÓŚŹŻąćęłńóśźż'

  - file: "gfonts://Roboto"
    id: clockbar_font
    size: 20
    bpp: 8
