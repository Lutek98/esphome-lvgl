                  text: "Start"
            on_click:
              - if:
                  condition:
                    lambda: 'return id(vacuum_state).state != "cleaning";'
                  then:
                    - homeassistant.service:
                        service: vacuum.start
                        data:
                          entity_id: vacuum.mova_e30_ultra

        # Pause
        - button:
            x: 215
            y: 42
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_pause
              - label:
                  align: bottom_left
                  text: "Pauza"
            on_click:
              - homeassistant.service:
                  service: vacuum.pause
                  data:
                    entity_id: vacuum.mova_e30_ultra

        # Return to base
        - button:
            x: 425
            y: 42
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_home
              - label:
                  align: bottom_left
                  text: "Do bazy"
            on_click:
              - homeassistant.service:
                  service: vacuum.return_to_base
                  data:
                    entity_id: vacuum.mova_e30_ultra

        # Clean room: Korytarz
        - button:
            x: 5
            y: 182
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_door
              - label:
                  align: bottom_left
                  text: "Korytarz"
            on_click:
              - if:
                  condition:
                    lambda: 'return std::string("$korytarz_segment_id") != "0";'
                  then:
                    - homeassistant.service:
                        service: dreame_vacuum.vacuum_clean_segment
                        data:
                          entity_id: vacuum.mova_e30_ultra
                          segments: "$korytarz_segment_id"

        # Locate (vacuum makes a sound)
        - button:
            x: 215
            y: 182
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_locate
              - label:
                  align: bottom_left
                  text: "Gdzie jesteś?"
            on_click:
              - homeassistant.service:
                  service: vacuum.locate
                  data:
                    entity_id: vacuum.mova_e30_ultra

        # Clear all notifications
        - button:
            x: 425
            y: 182
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_clear
              - label:
                  align: bottom_left
                  text: "Wyczyść powiad."
            on_click:
              - script.execute: clear_all_notifications

        # Back
        - button:
            x: 5
            y: 322
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_back
              - label:
                  align: bottom_left
                  text: "Wstecz"
            on_click:
              - lvgl.page.show: main_page

        # Vacuum state (display only)
        - button:
            x: 215
            y: 322
            height: $button_height
            width: $button_width
            clickable: false
            styles: control
            widgets:
              - label:
                  align: top_left
                  id: vacuum_state_label
                  text: "--"
              - label:
                  align: bottom_left
                  text: "Stan"

        # Notifications header
        - label:
            x: 640
            y: 44
            text: "Powiadomienia (dotknij = usuń)"
            text_color: $button_text_color

        # Shown when there are no notifications
        - label:
            id: notif_empty_label
            x: 700
            y: 300
            text: "Brak powiadomień"
            text_color: 0x808080

        # Notification row 0
        - button:
            id: notif_row_0
            x: 640
            y: 78
            width: 379
            height: 96
            hidden: true
            styles: control
            pad_all: 8
            widgets:
              - label:
                  id: notif_label_0
                  align: left_mid
                  width: 363
                  long_mode: WRAP
                  text: ""
            on_click:
              - script.execute:
                  id: dismiss_notification
                  idx: 0

        # Notification row 1
        - button:
            id: notif_row_1
            x: 640
            y: 182
            width: 379
            height: 96
            hidden: true
            styles: control
            pad_all: 8
            widgets:
              - label:
                  id: notif_label_1
                  align: left_mid
                  width: 363
                  long_mode: WRAP
                  text: ""
            on_click:
              - script.execute:
                  id: dismiss_notification
                  idx: 1

        # Notification row 2
        - button:
            id: notif_row_2
            x: 640
            y: 286
            width: 379
            height: 96
            hidden: true
            styles: control
            pad_all: 8
