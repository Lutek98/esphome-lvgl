# ---------------------------------------------------------------------------
# WPISZ ID POKOJU "Korytarz" z aplikacji/integracji odkurzacza (liczba).
# Znajdziesz go w HA: Narzedzia deweloperskie -> Stany -> vacuum.mova_e30_ultra
# -> atrybut "rooms". Dopoki jest 0, przycisk Korytarz nic nie zrobi.
# ---------------------------------------------------------------------------
substitutions:
  korytarz_segment_id: "6"

lvgl:
  displays: my_display
  byte_order: little_endian
  
  top_layer:
    widgets:
    
      # Clock
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          x: 0
          y: 8
          text_align: center
          text_color: 0xFFFFFF
          
  pages:
    - id: main_page
      layout: 
        type: flex
        flex_flow: column_wrap
        pad_row: 10
        pad_column: 10
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 42
      pad_bottom: 5
      pad_left: 5
      pad_right: 5
      
      widgets:

        # ---------- Column 1: lights ----------

        # Kitchen LED
        - button:
            id: kitchen_led_button
            height: $button_height
            width: $button_width
            checkable: true
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $ledstrip
              - label:
                  align: bottom_left
                  text: "Kuchnia LED"
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.kuchnia_led_kuchnia

        # Bathroom mirror light
        - button:
            id: bathroom_mirror_button
            height: $button_height
            width: $button_width
            checkable: true
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $mirror
              - label:
                  align: bottom_left
                  text: "Łazienka lustro"
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.lazienka_aqara_smart_wall_switch_swiatlo_lustro

        # Bathroom ceiling light
        - button:
            id: bathroom_ceiling_button
            height: $button_height
            width: $button_width
            checkable: true
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $ceiling_light
              - label:
                  align: bottom_left
                  text: "Łazienka sufit"
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.lazienka_aqara_smart_wall_switch_swiatlo_sufit

        # Empty slot (starts a new column)
        - obj:
            height: $button_height
            width: $button_width
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: false

        # ---------- Column 2: 3D printer ----------

        # 3D printer power (shows print progress while it is on)
        - button: 
            height: $button_height
            width: $button_width
            checkable: true
            id: printer_power_button
            styles: control
            widgets:
              # Icon (shown when OFF)
              - label:
                  text_font: $icon_font
                  align: top_left
                  id: printer_power_icon
                  text: $printer
              # Progress (shown when ON)
              - obj:
                  align: top_left
                  id: print_progress_container
                  height: SIZE_CONTENT
                  width: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: end
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  hidden: true
                  widgets:
                    - label:
                        text_font: statistics_font
                        text_color: $button_text_color
                        id: print_progress_label
                        text: "--"
                    - label:
                        text_font: label_font
                        text_color: $button_text_color
                        text: "%"
                        pad_bottom: 6
              - label:
                  align: bottom_left
                  text: "Drukarka"
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.pokoj_dzienny_drukarka_3d_gniazdko

        # Open printer page
        - button:
            id: printer_open_button
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_camera
              - label:
                  align: bottom_left
                  text: "Podgląd druku"
            on_click:
              - lvgl.page.show: printer_page

        # Printer air quality (display only)
        - button:
            height: $button_height
            width: $button_width
            clickable: false
            styles: control
            widgets:
              - label:
                  align: top_left
                  id: air_quality_label
                  text: "--"
              - label:
                  align: bottom_left
                  text: "Powietrze"

        # Open filament page (AMS slots)
        - button:
            id: filament_open_button
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $filament
              - label:
                  align: bottom_left
                  text: "Filament"
            on_click:
              - lvgl.page.show: filament_page

        # ---------- Column 3: vacuum ----------

        # Vacuum - start cleaning (ignored while already cleaning)
        - button:
            id: vacuum_button
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $vacuum
              - label:
                  align: bottom_left
                  text: "Odkurzacz"
            on_click:
              - if:
                  condition:
                    lambda: 'return id(vacuum_state).state != "cleaning";'
                  then:
                    - homeassistant.service:
                        service: vacuum.start
                        data:
                          entity_id: vacuum.mova_e30_ultra

        # Vacuum - pause
        - button:
            id: vacuum_pause_button
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_pause
              - label:
                  align: bottom_left
                  text: "Pauza"
            on_click:
              - homeassistant.service:
                  service: vacuum.pause
                  data:
                    entity_id: vacuum.mova_e30_ultra

        # Open vacuum page
        - button:
            id: vacuum_more_button
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_more
              - label:
                  id: vacuum_more_label
                  align: bottom_left
                  text: "Więcej"
            on_click:
              - lvgl.page.show: vacuum_page

    - id: printer_page
      bg_color: Black
      bg_opa: cover
      pad_all: 0
      scrollable: false
      widgets:

        # Camera placeholder (visible until the first picture arrives)
        - obj:
            x: 5
            y: 42
            width: 600
            height: 338
            bg_color: $button_control_color
            bg_opa: cover
            radius: $radius
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  id: camera_status_label
                  align: center
                  text: "Ładowanie obrazu z kamery..."

        # Camera picture (filled by addon/camera.yaml)
        - image:
            id: printer_camera_view
            src: printer_camera_image
            x: 5
            y: 42
            hidden: true

        # Print progress
        - button:
            x: 615
            y: 42
            height: $button_height
            width: 197
            clickable: false
            styles: control
            widgets:
              - obj:
                  align: top_left
                  height: SIZE_CONTENT
                  width: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: end
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - label:
                        text_font: statistics_font
                        text_color: $button_text_color
                        id: page_progress_label
                        text: "--"
                    - label:
                        text_font: label_font
                        text_color: $button_text_color
                        text: "%"
                        pad_bottom: 6
              - label:
                  align: bottom_left
                  text: "Postęp druku"

        # Print end time
        - button:
            x: 822
            y: 42
            height: $button_height
            width: 197
            clickable: false
            styles: control
            widgets:
              - label:
                  text_font: statistics_font
                  text_color: $button_text_color
                  align: top_left
                  id: end_time_label
                  text: "--:--"
              - label:
                  align: bottom_left
                  id: end_time_caption
                  text: "Koniec druku"

        # Air quality (display only)
        - button:
            x: 615
            y: 182
            height: $button_height
            width: 197
            clickable: false
            styles: control
            widgets:
              - label:
                  align: top_left
                  id: page_air_quality_label
                  text: "--"
              - label:
                  align: bottom_left
                  text: "Powietrze"

        # Printer power
        - button:
            id: page_power_button
            x: 822
            y: 182
            height: $button_height
            width: 197
            checkable: true
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $printer
              - label:
                  align: bottom_left
                  text: "Zasilanie"
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.pokoj_dzienny_drukarka_3d_gniazdko

        # Pause print
        - button:
            x: 615
            y: 322
            height: $button_height
            width: 197
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_pause
              - label:
                  align: bottom_left
                  text: "Wstrzymaj"
            on_click:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.pokoj_dzienny_p1s_wstrzymaj_drukowanie

        # Resume print
        - button:
            x: 822
            y: 322
            height: $button_height
            width: 197
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_resume
              - label:
                  align: bottom_left
                  text: "Wznów"
            on_click:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.pokoj_dzienny_p1s_wznow_drukowanie

        # Stop print (LONG PRESS only)
        - button:
            x: 615
            y: 462
            height: $button_height
            width: 197
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_stop
              - label:
                  align: bottom_left
                  text: "Stop druku\n(przytrzymaj)"
            on_long_press:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.pokoj_dzienny_p1s_zatrzymaj_drukowanie

        # Back
        - button:
            x: 5
            y: 462
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $icon_back
              - label:
                  align: bottom_left
                  text: "Wstecz"
            on_click:
              - lvgl.page.show: main_page

    - id: vacuum_page
      bg_color: Black
      bg_opa: cover
      pad_all: 0
      scrollable: false
      widgets:

        # Start cleaning
        - button:
            id: vacuum_page_start_button
            x: 5
            y: 42
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $vacuum
              - label:
