lvgl:
  displays: my_display
  byte_order: little_endian
  
  top_layer:
    widgets:
    
      # Clock
      - label:
          text: "--:--"
          id: display_time
          text_font: clockbar_font
          align: top_mid
          x: 0
          y: 8
          text_align: center
          text_color: 0xFFFFFF
          
  pages:
    - id: main_page
      layout: 
        type: flex
        flex_flow: column_wrap
        pad_row: 10
        pad_column: 10
      width: 100%
      bg_color: Black
      bg_opa: cover
      pad_top: 42
      pad_bottom: 5
      pad_left: 5
      pad_right: 5
      
      widgets:
      
        # ---------- Column 1: lights ----------

        # Kitchen LED
        - button:
            height: $button_height
            width: $button_width
            checkable: true
            id: kitchen_led_button
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $ledstrip
              - label:
                  align: bottom_left
                  text: "Kuchnia LED"
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.kuchnia_led_kuchnia

        # Bathroom mirror light
        - button:
            height: $button_height
            width: $button_width
            checkable: true
            id: bathroom_mirror_button
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $mirror
              - label:
                  align: bottom_left
                  text: "Lazienka lustro"
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.lazienka_aqara_smart_wall_switch_swiatlo_lustro

        # Bathroom ceiling light
        - button:
            height: $button_height
            width: $button_width
            checkable: true
            id: bathroom_ceiling_button
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $ceiling_light
              - label:
                  align: bottom_left
                  text: "Lazienka sufit"
            on_click:
              - homeassistant.service:
                  service: light.toggle
                  data:
                    entity_id: light.lazienka_aqara_smart_wall_switch_swiatlo_sufit

        # Empty slot (starts a new column)
        - obj:
            height: $button_height
            width: $button_width
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            clickable: false

        # ---------- Column 2: 3D printer ----------

        # 3d Printer
        - button: 
            height: $button_height
            width: $button_width
            checkable: true
            id: printer_power_button
            styles: control
            widgets:
              # Icon (shown when OFF)
              - label:
                  text_font: $icon_font
                  align: top_left
                  id: printer_power_icon
                  text: $printer
              # Progress (shown when ON)
              - obj:
                  align: top_left
                  id: print_progress_container
                  height: SIZE_CONTENT
                  width: SIZE_CONTENT
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_cross: end
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  hidden: true
                  widgets:
                    - label:
                        text_font: statistics_font
                        text_color: $button_text_color
                        id: print_progress_label
                        text: "--"
                    - label:
                        text_font: label_font
                        text_color: $button_text_color
                        text: "%"
                        pad_bottom: 6
              - label:
                  align: bottom_left
                  text: "Drukarka"
            on_click:
              - homeassistant.service:
                  service: switch.toggle
                  data:
                    entity_id: switch.pokoj_dzienny_drukarka_3d_gniazdko

        # Printer - pause print
        - button:
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_pause
              - label:
                  align: bottom_left
                  text: "Wstrzymaj"
            on_click:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.pokoj_dzienny_p1s_wstrzymaj_drukowanie

        # Printer - resume print
        - button:
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_resume
              - label:
                  align: bottom_left
                  text: "Wznow"
            on_click:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.pokoj_dzienny_p1s_wznow_drukowanie

        # Printer - stop print (LONG PRESS only, to avoid accidental cancel)
        - button:
            height: $button_height
            width: $button_width
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $print_stop
              - label:
                  align: bottom_left
                  text: "Stop druku\n(przytrzymaj)"
            on_long_press:
              - homeassistant.service:
                  service: button.press
                  data:
                    entity_id: button.pokoj_dzienny_p1s_zatrzymaj_drukowanie

        # ---------- Column 3: printer air quality ----------

        # Printer air quality (display only)
        - button:
            height: $button_height
            width: $button_width
            styles: control
            clickable: false
            widgets:
              - label:
                  align: top_left
                  id: air_quality_label
                  text: "--"
              - label:
                  align: bottom_left
                  text: "Powietrze"

        # Vacuum - start cleaning (does nothing while it is already cleaning)
        - button:
            height: $button_height
            width: $button_width
            id: vacuum_button
            styles: control
            widgets:
              - label:
                  text_font: $icon_font
                  align: top_left
                  text: $vacuum
              - label:
                  align: bottom_left
                  text: "Odkurzacz"
            on_click:
              - if:
                  condition:
                    lambda: 'return id(vacuum_state).state != "cleaning";'
                  then:
                    - homeassistant.service:
                        service: vacuum.start
                        data:
                          entity_id: vacuum.mova_e30_ultra
