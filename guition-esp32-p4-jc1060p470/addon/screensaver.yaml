# Screen saver: dims, then switches the backlight off when nobody touches the panel.
#  - a tap wakes the screen (the first tap only wakes it, it does not press a button)
#  - double-tap the TOP BAR (the strip with the clock) to put the screen to sleep at once
# You can change the times in your own panel yaml, e.g.:
#   substitutions:
#     screen_dim_after: 30s
#     screen_off_after: 5min
substitutions:
  screen_dim_after: 45s
  screen_off_after: 2min
  screen_dim_brightness: 20%

globals:
  # 0 = awake, 1 = dimmed, 2 = asleep
  - id: screen_state
    type: int
    restore_value: no
    initial_value: '0'

lvgl:
  on_idle:
    - timeout: ${screen_dim_after}
      then:
        - if:
            condition:
              lambda: 'return id(screen_state) == 0;'
            then:
              - lambda: 'id(screen_state) = 1;'
              - light.turn_on:
                  id: display_backlight
                  brightness: ${screen_dim_brightness}
    - timeout: ${screen_off_after}
      then:
        - script.execute: screen_sleep

script:
  # Go back to the main page, switch the backlight off and pause LVGL
  - id: screen_sleep
    then:
      - if:
          condition:
            lambda: 'return id(screen_state) != 2;'
          then:
            - lambda: 'id(screen_state) = 2;'
            - lvgl.page.show: main_page
            - delay: 200ms
            - light.turn_off: display_backlight
            - lvgl.pause:

touchscreen:
  - id: !extend my_touchscreen
    on_touch:
      # Reset LVGL's inactivity timer (a tap that only wakes the screen is not seen by LVGL)
      - lambda: 'lv_display_trigger_activity(lv_display_get_default());'
      - if:
          condition:
            lambda: 'return id(screen_state) != 0;'
          then:
            - lambda: 'id(screen_state) = 0;'
            - light.turn_on:
                id: display_backlight
                brightness: 100%
    on_release:
      # LVGL resumes by itself on release (resume_on_input); this is only a safety net
      - if:
          condition:
            lvgl.is_paused:
          then:
            - lvgl.resume:
